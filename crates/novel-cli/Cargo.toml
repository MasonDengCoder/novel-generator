[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# contract-governance-02-error-enum-gen：strum 作为编译期过程宏依赖（EnumIter + IntoStaticStr + serialize 注解），
# 把 ExitCode/ErrorCode enum 提升为错误契约类型化源，供 dev-only spec-gen 遍历变体生成 exit-codes/error-codes 表。
# 仅启用 `derive` feature（编译期过程宏 re-export，引入 strum_macros），不启用运行期 trait
# （AsRefStr/Display/EnumString 属 strum 运行期 trait，本切片不用，运行期二进制不链接其代码）。
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
anyhow = "1"
# contract-governance-03-struct-schema-gen：schemars 0.8 作为编译期过程宏依赖，
# 把 renderers/domain/services/repositories/errors 的 Serialize struct 提升为 JSON Schema
# 结构契约源，供 dev-only spec-gen 遍历派生 schema 生成 contracts/cli/json-schemas/*.json。
# 仅 `derive` feature（编译期 JsonSchema 过程宏），schemars 不进入 novel CLI 运行期热路径
# （CLI 不在运行期生成 schema，schema 生成由 spec-gen 在 dev/CI 时完成）。
schemars = { version = "0.8", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
comfy-table = { version = "7.1", default-features = false }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
